<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Pillsner</title>
    <link rel="stylesheet" href="/static/style.css">
    <script src="/static/gesture_focus.js" defer></script>
</head>
<body>
    <div class="rotate-90">
        <div class="container">
            <div class="toolbar">
                <a data-gfocus data-genter="link" href="/user">⬅ Wstecz</a>
                <button data-gfocus data-genter="js:location.reload()">⟳ Odśwież</button>
            </div>

            <h1>Pillsner</h1>
            <h2> Historia otwarć pudełka (ostatnie 20) </h2>

            <div class="logs-list">
                {% if logs %}
                    <ol class="pillsner-list">
                        {% for item in logs %}
                            <li class="log-card">
                                {{ item.received_at }}
                            </li>
                        {% endfor %}
                    </ol>
                {% else %}
                    <div class="log-card">
                        Brak odebranych komunikatów.
                    </div>
                {% endif %}
            </div>
        </div>
    </div>

    <script>
    function simulateKey(keyName) {
        const eventInit = {
            key: keyName,
            code: keyName,
            bubbles: true
        };

        const targets = [];
        if (document) targets.push(document);
        if (document.body) targets.push(document.body);
        if (window) targets.push(window);

        targets.forEach(target => {
            try {
                const evt = new KeyboardEvent("keydown", eventInit);
                target.dispatchEvent(evt);
            } catch (e) {
                console.error("Błąd dispatchEvent", e);
            }
        });
    }

    function handleGesture(gesture) {
        switch (gesture) {
            case "swipe_left":
                simulateKey("ArrowLeft");
                break;
            case "swipe_right":
                simulateKey("ArrowRight");
                break;
            case "swipe_up":
                simulateKey("ArrowUp");
                break;
            case "swipe_down":
                simulateKey("ArrowDown");
                break;
            case "ok":
                simulateKey("Enter");
                break;
        }
    }

    async function pollGestures() {
        try {
            const res = await fetch("/api/gesture", { cache: "no-store" });
            if (!res.ok) return;
            const data = await res.json();
            if (data.gesture) {
                handleGesture(data.gesture);
            }
        } catch (e) {
            console.error("Błąd /api/gesture:", e);
        } finally {
            setTimeout(pollGestures, 200);
        }
    }

    pollGestures();
    </script>
</body>
</html>
